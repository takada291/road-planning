      function gtag(){dataLayer.push(arguments);}

    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; overflow: hidden; }

        }
        #chart-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
        
        button { padding: 6px 12px; font-size: 13px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-blue { background-color: #007bff; } .btn-blue:hover { background-color: #0056b3; }
        .btn-green { background-color: #28a745; } .btn-green:hover { background-color: #218838; }
        .btn-red { background-color: #dc3545; } .btn-red:hover { background-color: #c82333; }
        .btn-gray { background-color: #6c757d; } .btn-gray:hover { background-color: #5a6268; }
        .btn-orange { background-color: #ff9800; } .btn-orange:hover { background-color: #e68a00; }
        .btn-purple { background-color: #9c27b0; } .btn-purple:hover { background-color: #7b1fa2; }
        .btn-teal { background-color: #20c997; } .btn-teal:hover { background-color: #1aa179; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        select, input[type="text"] { padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
        
        .mode-active { border: 2px solid #d32f2f; box-shadow: 0 0 8px rgba(211,47,47,0.8); background-color: #c82333;}
        
        #loading { display: none; font-weight: bold; color: #d32f2f; font-size: 14px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* カスタムマーカーのスタイル */
        .custom-marker {
            width: 12px; height: 12px; border-radius: 50%; border: 2px solid white;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <input type="text" id="latLonInput" placeholder="緯度, 経度" style="width: 120px;">

<div id="main-container">
    <div id="map"></div>
    <div id="chart-container">
        <div id="chart-header">
            <span>📉 縦断図</span>
            <span id="gradient-warning" style="color: red; display: none;">⚠️ 指定勾配を超過した区間（赤丸）あり！</span>
        </div>
        <div style="flex-grow: 1; position: relative;">
            <canvas id="profileChart"></canvas>
        </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/piexifjs@1.0.6/piexif.js"></script>

<script>
    const map = L.map('map').setView([36.065, 136.221], 15);
    
    const stdMap = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        attribution: '地理院タイル (標準地図)', maxZoom: 18
    });
    const orthoMap = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg', {
        attribution: '地理院タイル (オルソ画像)', maxZoom: 18
    });
    
    stdMap.addTo(map);
    L.control.layers({ "標準地形図": stdMap, "オルソ写真": orthoMap }).addTo(map);
    L.control.scale({ imperial: false, metric: true }).addTo(map);

    const frameLayer = L.rectangle([[0,0], [0,0]], {
        color: "#ff0000", weight: 2, fillOpacity: 0.0, interactive: false, dashArray: '5, 5'
    }).addTo(map);

    function updateFrame() {
        const center = map.getCenter();
        const latM = 2100 / 2; // A3スケール
        const lngM = 1485 / 2;
        const R = 6378137;
        const dLat = (lngM / R) * (180 / Math.PI);
        const dLng = (latM / (R * Math.cos(Math.PI * center.lat / 180))) * (180 / Math.PI);
        
        const bounds = L.latLngBounds([center.lat - dLat, center.lng - dLng], [center.lat + dLat, center.lng + dLng]);
        frameLayer.setBounds(bounds);
    }
    map.on('move', updateFrame);
    updateFrame();

    let isDrawMode = false;
    let isFetching = false;
    let routeData = []; // [{lat, lng, ele, dist, grad}]
    let routePolyline = null;
    let routeMarkers = [];
    let myChart = null;
    let elevationOverlay = null;

    function toggleDrawMode() {
        isDrawMode = !isDrawMode;
        const btn = document.getElementById('btnDraw');
        if (isDrawMode) {
            btn.classList.add('mode-active');
            map.getContainer().style.cursor = 'crosshair';
        } else {
            btn.classList.remove('mode-active');
            map.getContainer().style.cursor = 'grab';
        }
    }

    map.on('click', async function(e) {
        if (!isDrawMode || isFetching) return;
        isFetching = true;
        document.getElementById('loading').style.display = 'inline';

        const latlng = e.latlng;
        const ele = await getElevation(latlng.lat, latlng.lng);
        
        routeData.push({
            lat: latlng.lat,
            lng: latlng.lng,
            ele: ele,
            dist: 0,
            grad: 0
        });

        recalculateRoute();
        drawRouteOnMap();
        updateChart();

        document.getElementById('loading').style.display = 'none';
        isFetching = false;
    });

    function recalculateRoute() {
        let totalDist = 0;
        for (let i = 0; i < routeData.length; i++) {
            let dist = 0;
            let grad = 0;
            if (i > 0) {
                const prev = routeData[i - 1];
                dist = map.distance([prev.lat, prev.lng], [routeData[i].lat, routeData[i].lng]);
                totalDist += dist;
                if (dist > 0) {
                    grad = ((routeData[i].ele - prev.ele) / dist) * 100;
                }
            }
            routeData[i].dist = totalDist;
            routeData[i].grad = grad;
        }
    }

    function undoLastPoint() {
        if (routeData.length === 0) return;
        routeData.pop();
        recalculateRoute();
        drawRouteOnMap();
        updateChart();
    }

    function clearRoute() {
        if (confirm("ルートをすべてクリアしますか？")) {
            routeData = [];
            drawRouteOnMap();
            updateChart();
        }
    }

    // --- KML保存・読込処理 ---
    function saveKML() {
        if (routeData.length === 0) {
            alert("保存するデータがありません。");
            return;
        }

        let kml = '<?xml version="1.0" encoding="UTF-8"?>\n';
        kml += '<kml xmlns="http://www.opengis.net/kml/2.2">\n';
        kml += '  <Document>\n';
        kml += '    <name>路網計画ルート</name>\n';
        kml += '    <description>路網計画アプリ(v1.2)から出力されたデータ</description>\n';
        
        // ライン
        kml += '    <Placemark>\n';
        kml += '      <name>計画線形</name>\n';
        kml += '      <LineString>\n';
        kml += '        <tessellate>1</tessellate>\n';
        kml += '        <coordinates>\n';
        routeData.forEach(d => {
            kml += `          ${d.lng},${d.lat},${d.ele}\n`;
        });
        kml += '        </coordinates>\n';
        kml += '      </LineString>\n';
        kml += '    </Placemark>\n';

        // 各ポイント（マーカー）
        routeData.forEach((d, idx) => {
            kml += '    <Placemark>\n';
            kml += `      <name>Point ${idx + 1}</name>\n`;
            kml += `      <description>標高: ${d.ele.toFixed(1)}m</description>\n`;
            kml += '      <Point>\n';
            kml += `        <coordinates>${d.lng},${d.lat},${d.ele}</coordinates>\n`;
            kml += '      </Point>\n';
            kml += '    </Placemark>\n';
        });

        kml += '  </Document>\n';
        kml += '</kml>';

        const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'road_planning.kml';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    function loadKML(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(e.target.result, "text/xml");
                
                const lineStrings = xmlDoc.getElementsByTagName("LineString");
                if (lineStrings.length === 0) {
                    alert("KMLファイルからルート線(LineString)を見つけることができませんでした。");
                    return;
                }
                
                const coordsText = lineStrings[0].getElementsByTagName("coordinates")[0].textContent;
                const coordPairs = coordsText.trim().split(/\s+/);
                
                if (coordPairs.length === 0) return;

                routeData = [];
                document.getElementById('loading').style.display = 'inline';
                document.getElementById('loading').innerText = 'データ読込中...';
                
                for (let i = 0; i < coordPairs.length; i++) {
                    const parts = coordPairs[i].split(',');
                    if (parts.length >= 2) {
                        const lng = parseFloat(parts[0]);
                        const lat = parseFloat(parts[1]);
                        let ele = parts.length >= 3 ? parseFloat(parts[2]) : null;
                        
                        if (ele === null || isNaN(ele) || ele === 0) {
                            ele = await getElevation(lat, lng);
                        }
                        
                        routeData.push({ lat: lat, lng: lng, ele: ele, dist: 0, grad: 0 });
                    }
                }

                recalculateRoute();
                drawRouteOnMap();
                updateChart();
                
                if (routePolyline) {
                    map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
                }

            } catch (error) {
                console.error(error);
                alert("KMLファイルの読み込み処理に失敗しました。");
            } finally {
                document.getElementById('loading').style.display = 'none';
                event.target.value = ''; // 連続して同じファイルを選択可能にするため
            }
        };
        reader.readAsText(file);
    }

    async function getElevation(lat, lng) {
        const z = 15;
        const x = Math.floor((lng + 180) / 360 * Math.pow(2, z));
        const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
        
        const types = ['dem5a_png', 'dem5b_png', 'dem5c_png'];
        for (const type of types) {
            try {
                const url = `https://cyberjapandata.gsi.go.jp/xyz/${type}/${z}/${x}/${y}.png`;
                const img = await loadImage(url);
                const ele = readPixelElevation(img, lat, lng, x, y, z);
                if (ele !== null) return ele;
            } catch (e) { /* 次のDEMへ */ }
        }
        return 0;
    }

    function loadImage(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = url;
        });
    }

    function readPixelElevation(img, lat, lng, tx, ty, z) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        
        const px = Math.floor(((lng + 180) / 360 * Math.pow(2, z) - tx) * 256);
        const py = Math.floor(((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z) - ty) * 256);
        
        const data = ctx.getImageData(px, py, 1, 1).data;
        const r = data[0], g = data[1], b = data[2], a = data[3];
        if (a === 0 || (r===128 && g===0 && b===0)) return null;
        const v = (r << 16) + (g << 8) + b;
        return (v < 8388608) ? v * 0.01 : (v - 16777216) * 0.01;
    }

    function drawRouteOnMap() {
        if (routePolyline) map.removeLayer(routePolyline);
        routeMarkers.forEach(m => map.removeLayer(m));
        routeMarkers = [];

        if (routeData.length === 0) return;

        const latlngs = routeData.map(d => [d.lat, d.lng]);
        routePolyline = L.polyline(latlngs, {color: '#007bff', weight: 4}).addTo(map);

        const maxGrad = parseFloat(document.getElementById('maxGradient').value);

        routeData.forEach((d, idx) => {
            let bgColor = '#36a2eb';
            if (idx > 0 && Math.abs(d.grad) > maxGrad) {
                bgColor = '#ff6384';
            } else if (idx === 0) {
                bgColor = '#4caf50';
            }

            const iconHtml = `<div class="custom-marker" style="background-color: ${bgColor};"></div>`;
            const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [16, 16], iconAnchor: [8, 8] });

            const marker = L.marker([d.lat, d.lng], { icon: customIcon, draggable: true }).addTo(map);
            
            marker.on('dragend', async function(e) {
                document.getElementById('loading').style.display = 'inline';
                isFetching = true;
                
                const newPos = e.target.getLatLng();
                routeData[idx].lat = newPos.lat;
                routeData[idx].lng = newPos.lng;
                routeData[idx].ele = await getElevation(newPos.lat, newPos.lng);
                
                recalculateRoute();
                drawRouteOnMap();
                updateChart();
                
                document.getElementById('loading').style.display = 'none';
                isFetching = false;
            });
            
            routeMarkers.push(marker);
        });
    }

    function updateChart() {
        const ctx = document.getElementById('profileChart').getContext('2d');
        const maxGrad = parseFloat(document.getElementById('maxGradient').value);
        
        let labels = [];
        let elevations = [];
        let pointColors = [];
        let hasWarning = false;

        for (let i = 0; i < routeData.length; i++) {
            labels.push(Math.round(routeData[i].dist) + 'm');
            elevations.push(routeData[i].ele);
            
            let color = '#36a2eb';
            if (i > 0) {
                if (Math.abs(routeData[i].grad) > maxGrad) {
                    color = '#ff6384';
                    hasWarning = true;
                }
            } else if (i === 0) {
                color = '#4caf50';
            }
            pointColors.push(color);
        }

        document.getElementById('gradient-warning').style.display = hasWarning ? 'inline' : 'none';

        if (myChart) myChart.destroy();
        
        if (routeData.length === 0) return;

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '標高 (m)',
                    data: elevations,
                    borderColor: '#36a2eb',
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    pointBackgroundColor: pointColors,
                    pointRadius: 6,
                    pointHoverRadius: 8,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: { left: 10, right: 30 }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let idx = context.dataIndex;
                                let ele = routeData[idx].ele.toFixed(1);
                                let grad = routeData[idx].grad.toFixed(1);
                                if (idx === 0) return `標高: ${ele}m (起点)`;
                                return `標高: ${ele}m / 勾配: ${grad > 0 ? '+' : ''}${grad}%`;
                            }
                        }
                    }
                },
                scales: {
                    x: { 
                        title: { display: true, text: '距離 (m)' },
                        ticks: { maxRotation: 45, minRotation: 0 }
                    },
                    y: { title: { display: true, text: '標高 (m)' } }
                }
            }
        });
    }

    // --- 5m標高色分け機能 ---
    async function createElevationLayer() {
        const loading = document.getElementById('loading');
        loading.style.display = 'inline';
        loading.innerText = "色分けデータ生成中...";

        if (elevationOverlay) {
            map.removeLayer(elevationOverlay);
            elevationOverlay = null;
        }

        try {
            const bounds = frameLayer.getBounds();
            const z = 15;
            
            const topLeft = map.project(bounds.getNorthWest(), z);
            const bottomRight = map.project(bounds.getSouthEast(), z);

            const minTileX = Math.floor(topLeft.x / 256);
            const minTileY = Math.floor(topLeft.y / 256);
            const maxTileX = Math.floor(bottomRight.x / 256);
            const maxTileY = Math.floor(bottomRight.y / 256);

            const tw = 256;
            const canvas = document.createElement('canvas');
            canvas.width = (maxTileX - minTileX + 1) * tw;
            canvas.height = (maxTileY - minTileY + 1) * tw;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            const fetchDemTile = (x, y, z) => {
                return new Promise((resolve) => {
                    const types = ['dem5a_png', 'dem5b_png', 'dem5c_png'];
                    let currentIdx = 0;
                    
                    const tryNext = () => {
                        if (currentIdx >= types.length) {
                            resolve(null);
                            return;
                        }
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        img.src = `https://cyberjapandata.gsi.go.jp/xyz/${types[currentIdx]}/${z}/${x}/${y}.png`;
                        img.onload = () => resolve(img);
                        img.onerror = () => {
                            currentIdx++;
                            tryNext();
                        };
                    };
                    tryNext();
                });
            };

            const promises = [];
            for (let x = minTileX; x <= maxTileX; x++) {
                for (let y = minTileY; y <= maxTileY; y++) {
                    promises.push(fetchDemTile(x, y, z).then(img => {
                        if (img) {
                            ctx.drawImage(img, (x - minTileX) * tw, (y - minTileY) * tw);
                        }
                    }));
                }
            }
            await Promise.all(promises);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const outData = ctx.createImageData(canvas.width, canvas.height);
            
            const getZ = (i) => {
                const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
                if (a === 0 || (r === 128 && g === 0 && b === 0) || (r === 0 && g === 0 && b === 0)) return null;
                const v = (r << 16) + (g << 8) + b;
                return (v < 8388608) ? v * 0.01 : (v - 16777216) * 0.01;
            };

            const colors = [
                [0, 0, 128], [0, 0, 255], [0, 128, 255], [0, 255, 255], [128, 255, 128],
                [0, 255, 0], [128, 255, 0], [255, 255, 0], [255, 128, 0], [255, 0, 0],
                [128, 0, 0], [255, 0, 255], [128, 0, 128], [255, 128, 255], [128, 128, 255],
                [0, 128, 128], [128, 128, 0], [128, 128, 128], [192, 192, 192], [255, 255, 255]
            ];

            const w = canvas.width;
            for (let py = 0; py < canvas.height; py++) {
                for (let px = 0; px < w; px++) {
                    const idx = (py * w + px) * 4;
                    const zC = getZ(idx);
                    
                    if (zC === null) {
                        outData.data[idx+3] = 0;
                        continue;
                    }
                    
                    const colorIdx = Math.floor(zC / 5) % colors.length;
                    const c = colors[colorIdx];
                    
                    outData.data[idx] = c[0];
                    outData.data[idx+1] = c[1];
                    outData.data[idx+2] = c[2];
                    outData.data[idx+3] = 128;
                }
            }
            ctx.putImageData(outData, 0, 0);

            const pxWest = Math.round(topLeft.x - minTileX * 256);
            const pxNorth = Math.round(topLeft.y - minTileY * 256);
            const cropW = Math.round(bottomRight.x - topLeft.x);
            const cropH = Math.round(bottomRight.y - topLeft.y);
            
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            const cropCtx = cropCanvas.getContext('2d');
            
            cropCtx.drawImage(canvas, pxWest, pxNorth, cropW, cropH, 0, 0, cropW, cropH);
            
            const exportDataUrl = cropCanvas.toDataURL('image/png');
            
            elevationOverlay = L.imageOverlay(exportDataUrl, bounds, { opacity: 0.7 }).addTo(map);

        } catch (error) {
            console.error("色分けエラー:", error);
            alert("標高色分けの作成に失敗しました。\n" + error.message);
        } finally {
            loading.style.display = 'none';
            loading.innerText = '処理中...';
        }
    }

    async function exportA3() {
        const btnExport = document.getElementById('btnExport');
        const loading = document.getElementById('loading');
        
        try {
            loading.style.display = 'inline';
            btnExport.disabled = true;

            const bounds = frameLayer.getBounds();
            const z = 15;
            const topLeft = map.project(bounds.getNorthWest(), z);
            const bottomRight = map.project(bounds.getSouthEast(), z);

            const minTileX = Math.floor(topLeft.x / 256);
            const minTileY = Math.floor(topLeft.y / 256);
            const maxTileX = Math.floor(bottomRight.x / 256);
            const maxTileY = Math.floor(bottomRight.y / 256);

            const tw = 256;
            const canvas = document.createElement('canvas');
            canvas.width = (maxTileX - minTileX + 1) * tw;
            canvas.height = (maxTileY - minTileY + 1) * tw;
            const ctx = canvas.getContext('2d');

            const promises = [];
            for (let x = minTileX; x <= maxTileX; x++) {
                for (let y = minTileY; y <= maxTileY; y++) {
                    promises.push(new Promise((resolve) => {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        img.src = `https://cyberjapandata.gsi.go.jp/xyz/std/${z}/${x}/${y}.png`;
                        img.onload = () => {
                            ctx.drawImage(img, (x - minTileX) * tw, (y - minTileY) * tw);
                            resolve();
                        };
                        img.onerror = resolve;
                    }));
                }
            }
            await Promise.all(promises);
            
            if (elevationOverlay) {
                 const overlayImg = new Image();
                 overlayImg.crossOrigin = 'anonymous';
                 overlayImg.src = elevationOverlay._url;
                 await new Promise((resolve) => {
                     overlayImg.onload = () => {
                         const pxWest = Math.round(topLeft.x - minTileX * tw);
                         const pxNorth = Math.round(topLeft.y - minTileY * tw);
                         ctx.globalAlpha = 0.7;
                         ctx.drawImage(overlayImg, pxWest, pxNorth);
                         ctx.globalAlpha = 1.0;
                         resolve();
                     };
                 });
            }

            if (routeData.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#007bff';
                ctx.lineWidth = 4;
                for (let i = 0; i < routeData.length; i++) {
                    const pt = map.project([routeData[i].lat, routeData[i].lng], z);
                    const cx = pt.x - (minTileX * tw);
                    const cy = pt.y - (minTileY * tw);
                    if (i === 0) ctx.moveTo(cx, cy);
                    else ctx.lineTo(cx, cy);
                }
                ctx.stroke();

                const maxGrad = parseFloat(document.getElementById('maxGradient').value);
                for (let i = 0; i < routeData.length; i++) {
                    const pt = map.project([routeData[i].lat, routeData[i].lng], z);
                    const cx = pt.x - (minTileX * tw);
                    const cy = pt.y - (minTileY * tw);
                    
                    ctx.beginPath();
                    ctx.arc(cx, cy, 6, 0, 2 * Math.PI, false);
                    if (i === 0) ctx.fillStyle = '#4caf50';
                    else if (Math.abs(routeData[i].grad) > maxGrad) ctx.fillStyle = '#ff6384';
                    else ctx.fillStyle = '#36a2eb';
                    
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }
            }

            const pxWest = Math.round(topLeft.x - minTileX * tw);
            const pxNorth = Math.round(topLeft.y - minTileY * tw);
            const cropW = Math.round(bottomRight.x - topLeft.x);
            const cropH = Math.round(bottomRight.y - topLeft.y);
            
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            const cropCtx = cropCanvas.getContext('2d');
            
            cropCtx.fillStyle = '#ffffff';
            cropCtx.fillRect(0, 0, cropW, cropH);
            cropCtx.drawImage(canvas, pxWest, pxNorth, cropW, cropH, 0, 0, cropW, cropH);
            
            const exportDataUrl = cropCanvas.toDataURL('image/jpeg', 0.95);

            const s = bounds.getSouth().toFixed(6);
            const w = bounds.getWest().toFixed(6);
            const n = bounds.getNorth().toFixed(6);
            const e = bounds.getEast().toFixed(6);
            
            const coordsString = `${s},${w},${n},${e}`;
            const zeroth = {};
            zeroth[piexif.ImageIFD.ImageDescription] = coordsString;
            const exifObj = {"0th": zeroth, "Exif": {}, "GPS": {}};
            const exifBytes = piexif.dump(exifObj);
            
            const newDataUrl = piexif.insert(exifBytes, exportDataUrl);
            const filename = `road-planning_${s}_${w}_${n}_${e}.jpg`;
            
            const arr = newDataUrl.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let len = bstr.length;
            const u8arr = new Uint8Array(len);
            while(len--) u8arr[len] = bstr.charCodeAt(len);
            const blob = new Blob([u8arr], {type: mime});

            const blobUrl = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = filename;
            link.href = blobUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => window.URL.revokeObjectURL(blobUrl), 100);

        } catch (error) {
            console.error("生成エラー:", error);
            alert("画像の作成に失敗しました。\n" + error.message);
        } finally {
            loading.style.display = 'none';
            btnExport.disabled = false;
        }
    }

    function changePref() {
        const val = document.getElementById("prefSelect").value.split(",");
        map.setView([parseFloat(val[0]), parseFloat(val[1])], 14);
    }
    function jumpToCoordinates() {
        const inputVal = document.getElementById("latLonInput").value.replace(/,/g, ' ').trim().split(/\s+/);
        if (inputVal.length >= 2) map.setView([parseFloat(inputVal[0]), parseFloat(inputVal[1])], 15);
    }
</script>
