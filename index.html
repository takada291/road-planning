<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        #controls { padding: 10px; background: #f8f9fa; display: flex; gap: 8px; align-items: center; z-index: 1000; border-bottom: 1px solid #ccc; flex-wrap: wrap; font-size: 14px; }
        
        #main-container { display: flex; flex-direction: column; flex-grow: 1; height: calc(100vh - 60px); }
        #map { flex-grow: 1; width: 100%; min-height: 50%; cursor: crosshair; }
        
        #chart-container { 
            height: 250px; width: 100%; background: #fff; border-top: 2px solid #ccc; box-sizing: border-box; padding: 10px; display: flex; flex-direction: column;
        }
        #chart-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
        
        button { padding: 6px 12px; font-size: 13px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-blue { background-color: #007bff; } .btn-blue:hover { background-color: #0056b3; }
        .btn-green { background-color: #28a745; } .btn-green:hover { background-color: #218838; }
        .btn-red { background-color: #dc3545; } .btn-red:hover { background-color: #c82333; }
        .btn-gray { background-color: #6c757d; } .btn-gray:hover { background-color: #5a6268; }
        .btn-orange { background-color: #ff9800; } .btn-orange:hover { background-color: #e68a00; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        select, input[type="text"] { padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
        
        .mode-active { border: 2px solid #d32f2f; box-shadow: 0 0 8px rgba(211,47,47,0.8); background-color: #c82333;}
        
        #loading { display: none; font-weight: bold; color: #d32f2f; font-size: 14px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div id="controls">

        <option value="43.064,141.347">北海道</option>
        <option value="40.824,140.740">青森県</option>
        <option value="39.703,141.152">岩手県</option>
        <option value="38.268,140.871">宮城県</option>
        <option value="39.718,140.102">秋田県</option>
        <option value="38.255,140.339">山形県</option>
        <option value="37.750,140.467">福島県</option>
        <option value="36.341,140.446">茨城県</option>
        <option value="36.565,139.883">栃木県</option>
        <option value="36.391,139.060">群馬県</option>
        <option value="35.857,139.648">埼玉県</option>
        <option value="35.605,140.123">千葉県</option>
        <option value="35.689,139.691">東京都</option>
        <option value="35.447,139.642">神奈川県</option>
        <option value="37.902,139.023">新潟県</option>
        <option value="36.695,137.211">富山県</option>
        <option value="36.594,136.625">石川県</option>
        <option value="36.065,136.221" selected>福井県</option> 
        <option value="35.663,138.568">山梨県</option>
        <option value="36.651,138.181">長野県</option>
        <option value="35.391,136.722">岐阜県</option>
        <option value="34.976,138.383">静岡県</option>
        <option value="35.180,136.906">愛知県</option>
        <option value="34.730,136.508">三重県</option>
        <option value="35.021,135.755">滋賀県</option>
        <option value="35.011,135.768">京都府</option>
        <option value="34.686,135.520">大阪府</option>
        <option value="34.691,135.183">兵庫県</option>
        <option value="34.685,135.832">奈良県</option>
        <option value="34.226,135.167">和歌山県</option>
        <option value="35.503,134.238">鳥取県</option>
        <option value="35.472,133.050">島根県</option>
        <option value="34.661,133.935">岡山県</option>
        <option value="34.396,132.459">広島県</option>
        <option value="34.186,131.470">山口県</option>
        <option value="34.065,134.559">徳島県</option>
        <option value="34.340,134.043">香川県</option>
        <option value="33.841,132.766">愛媛県</option>
        <option value="33.559,133.531">高知県</option>
        <option value="33.606,130.418">福岡県</option>
        <option value="33.249,130.298">佐賀県</option>
        <option value="32.744,129.873">長崎県</option>
        <option value="32.789,130.741">熊本県</option>
        <option value="33.238,131.612">大分県</option>
        <option value="31.911,131.423">宮崎県</option>
        <option value="31.560,130.558">鹿児島県</option>
        <option value="26.212,127.681">沖縄県</option>
    </select>
    
    <input type="text" id="latLonInput" placeholder="緯度, 経度" style="width: 120px;">
    <button class="btn-gray" onclick="jumpToCoordinates()">移動</button>
    
    |
    <label>縦断勾配限界: 
        <select id="maxGradient" onchange="updateChart()">
            <option value="5">5%</option>
            <option value="10" selected>10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
        </select>
    </label>
    |
    <button class="btn-red" id="btnDraw" onclick="toggleDrawMode()">🖍️ 描画モード</button>
    <button class="btn-orange" onclick="undoLastPoint()">↩️ UNDO</button>
    <button class="btn-gray" onclick="clearRoute()">🗑️ クリア</button>
    |
    <span style="font-weight: bold; color: #555;">[A3横サイズ枠]</span>
    <button class="btn-gray" onclick="exportA3()">💾 A3画像切出</button>
    <span id="loading">標高取得中...</span>
</div>

<div id="main-container">
    <div id="map"></div>
    <div id="chart-container">
        <div id="chart-header">
            <span>📉 縦断図（プロファイル）</span>
            <span id="gradient-warning" style="color: red; display: none;">⚠️ 指定勾配を超過している区間があります！</span>
        </div>
        <canvas id="profileChart"></canvas>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // --- 1. 地図の初期化 ---
    const map = L.map('map').setView([36.065, 136.221], 15);
    
    const stdMap = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
        attribution: '地理院タイル (標準地図)', maxZoom: 18
    });
    const orthoMap = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/ort/{z}/{x}/{y}.jpg', {
        attribution: '地理院タイル (オルソ画像)', maxZoom: 18
    });
    
    stdMap.addTo(map);
    L.control.layers({ "標準地形図": stdMap, "オルソ写真": orthoMap }).addTo(map);
    L.control.scale({ imperial: false, metric: true }).addTo(map);

    // --- A3横切り出し枠 ---
    const frameLayer = L.rectangle([[0,0], [0,0]], {
        color: "#ff0000", weight: 2, fillOpacity: 0.0, interactive: false, dashArray: '5, 5'
    }).addTo(map);
    
    const frameLabel = L.marker([0,0], {
        icon: L.divIcon({className: 'dummy', html: '<div style="color:red; font-weight:bold; text-shadow: 1px 1px 2px white; width:100px;">A3横サイズ</div>'})
    }).addTo(map);

    function updateFrame() {
        const center = map.getCenter();
        const latM = 2100 / 2; // A3スケール
        const lngM = 1485 / 2;
        const R = 6378137;
        const dLat = (lngM / R) * (180 / Math.PI);
        const dLng = (latM / (R * Math.cos(Math.PI * center.lat / 180))) * (180 / Math.PI);
        
        const bounds = L.latLngBounds([center.lat - dLat, center.lng - dLng], [center.lat + dLat, center.lng + dLng]);
        frameLayer.setBounds(bounds);
        frameLabel.setLatLng([center.lat + dLat, center.lng - dLng]); // 左上にラベル
    }
    map.on('move', updateFrame);
    updateFrame();

    // --- 2. 状態管理（手動描画） ---
    let isDrawMode = false;
    let isFetching = false;
    let routeData = []; // [{lat, lng, ele, dist, grad}]
    let routePolyline = null;
    let routeMarkers = [];

    function toggleDrawMode() {
        isDrawMode = !isDrawMode;
        const btn = document.getElementById('btnDraw');
        if (isDrawMode) {
            btn.classList.add('mode-active');
            map.getContainer().style.cursor = 'crosshair';
        } else {
            btn.classList.remove('mode-active');
            map.getContainer().style.cursor = 'grab';
        }
    }

    map.on('click', async function(e) {
        if (!isDrawMode || isFetching) return;
        isFetching = true;
        document.getElementById('loading').style.display = 'inline';

        const latlng = e.latlng;
        const ele = await getElevation(latlng.lat, latlng.lng);
        
        let dist = 0;
        let totalDist = 0;
        let grad = 0;

        if (routeData.length > 0) {
            const prev = routeData[routeData.length - 1];
            dist = map.distance([prev.lat, prev.lng], [latlng.lat, latlng.lng]);
            totalDist = prev.dist + dist;
            
            if (dist > 0) {
                grad = ((ele - prev.ele) / dist) * 100; // 上りはプラス、下りはマイナス
            }
        }

        routeData.push({
            lat: latlng.lat,
            lng: latlng.lng,
            ele: ele,
            dist: totalDist,
            grad: grad
        });

        drawRouteOnMap();
        updateChart();

        document.getElementById('loading').style.display = 'none';
        isFetching = false;
    });

    function undoLastPoint() {
        if (routeData.length === 0) return;
        routeData.pop();
        drawRouteOnMap();
        updateChart();
    }

    function clearRoute() {
        if (confirm("ルートをすべてクリアしますか？")) {
            routeData = [];
            drawRouteOnMap();
            updateChart();
        }
    }

    // --- 3. 標高取得 (DEM) ---
    async function getElevation(lat, lng) {
        const z = 15;
        const x = Math.floor((lng + 180) / 360 * Math.pow(2, z));
        const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
        
        const types = ['dem5a_png', 'dem5b_png', 'dem5c_png'];
        for (const type of types) {
            try {
                const url = `https://cyberjapandata.gsi.go.jp/xyz/${type}/${z}/${x}/${y}.png`;
                const img = await loadImage(url);
                const ele = readPixelElevation(img, lat, lng, x, y, z);
                if (ele !== null) return ele;
            } catch (e) { /* 次のDEMへ */ }
        }
        return 0;
    }

    function loadImage(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = url;
        });
    }

    function readPixelElevation(img, lat, lng, tx, ty, z) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        
        const px = Math.floor(((lng + 180) / 360 * Math.pow(2, z) - tx) * 256);
        const py = Math.floor(((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z) - ty) * 256);
        
        const data = ctx.getImageData(px, py, 1, 1).data;
        const r = data[0], g = data[1], b = data[2], a = data[3];
        if (a === 0 || (r===128 && g===0 && b===0)) return null;
        const v = (r << 16) + (g << 8) + b;
        return (v < 8388608) ? v * 0.01 : (v - 16777216) * 0.01;
    }

    // --- 4. マップへの描画 ---
    function drawRouteOnMap() {
        if (routePolyline) map.removeLayer(routePolyline);
        routeMarkers.forEach(m => map.removeLayer(m));
        routeMarkers = [];

        if (routeData.length === 0) return;

        const latlngs = routeData.map(d => [d.lat, d.lng]);
        routePolyline = L.polyline(latlngs, {color: '#007bff', weight: 4}).addTo(map);

        routeData.forEach((d, idx) => {
            const isEndpoint = (idx === 0 || idx === routeData.length - 1);
            const color = idx === 0 ? 'blue' : (idx === routeData.length - 1 ? 'red' : '#ff9800');
            const m = L.circleMarker([d.lat, d.lng], { color: color, fillColor: '#fff', fillOpacity: 1, radius: isEndpoint ? 6 : 4 })
                .addTo(map);
            routeMarkers.push(m);
        });
    }

    // --- 5. 縦断図 (Chart.js) ---
    let myChart = null;
    function updateChart() {
        const ctx = document.getElementById('profileChart').getContext('2d');
        const maxGrad = parseFloat(document.getElementById('maxGradient').value);
        
        let labels = [];
        let elevations = [];
        let pointColors = [];
        let hasWarning = false;

        for (let i = 0; i < routeData.length; i++) {
            labels.push(Math.round(routeData[i].dist) + 'm');
            elevations.push(routeData[i].ele);
            
            let color = '#36a2eb';
            if (i > 0) {
                if (Math.abs(routeData[i].grad) > maxGrad) {
                    color = '#ff6384'; // 指定勾配オーバー
                    hasWarning = true;
                }
            }
            pointColors.push(color);
        }

        document.getElementById('gradient-warning').style.display = hasWarning ? 'inline' : 'none';

        if (myChart) myChart.destroy();
        
        if (routeData.length === 0) return; // データなし時は描画しない

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '標高 (m)',
                    data: elevations,
                    borderColor: '#36a2eb',
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    pointBackgroundColor: pointColors,
                    pointRadius: 5,
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let idx = context.dataIndex;
                                let ele = routeData[idx].ele.toFixed(1);
                                let grad = routeData[idx].grad.toFixed(1);
                                if (idx === 0) return `標高: ${ele}m (起点)`;
                                return `標高: ${ele}m / 勾配: ${grad > 0 ? '+' : ''}${grad}%`;
                            }
                        }
                    }
                },
                scales: {
                    x: { title: { display: true, text: '距離 (m)' } },
                    y: { title: { display: true, text: '標高 (m)' } }
                }
            }
        });
    }

    // --- ユーティリティ ---
    function changePref() {
        const val = document.getElementById("prefSelect").value.split(",");
        map.setView([parseFloat(val[0]), parseFloat(val[1])], 14);
    }
    function jumpToCoordinates() {
        const inputVal = document.getElementById("latLonInput").value.replace(/,/g, ' ').trim().split(/\s+/);
        if (inputVal.length >= 2) map.setView([parseFloat(inputVal[0]), parseFloat(inputVal[1])], 15);
    }
    function exportA3() {
        alert("画像の作成・保存処理をここに実装します（微地形図アプリのcanvas処理等を流用）。");
    }
</script>
</body>
</html>
